# 毎朝ニュースを集めて AI で選び、DB に保存する。
# 時刻は UTC で書く（日本時間 − 9 時間）。変えるときは下の cron を書き換える。
#   21:17 UTC = 日本時間 6:17（本番）
#   23:47 UTC = 日本時間 8:47（GitHub の遅延や失敗に備えた再実行。今日の分が済んでいれば何もしない）
name: daily news

on:
  schedule:
    - cron: "17 21 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual / web（画面の「今すぐ集める」）"
        default: manual

concurrency:
  group: pnba-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PNBA_DISCORD_WEBHOOK_URL: ${{ secrets.PNBA_DISCORD_WEBHOOK_URL }}
          PNBA_PUBLIC_URL: ${{ vars.PNBA_PUBLIC_URL }}
          PNBA_GEMINI_MODEL: ${{ vars.PNBA_GEMINI_MODEL }}
          PNBA_TZ: ${{ vars.PNBA_TZ }}
        run: python -m pnba run --trigger "${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}"

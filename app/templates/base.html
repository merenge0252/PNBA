<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}PNBA{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
<header class="bar">
  <a class="brand" href="/">PNBA</a>
  {% block nav %}
  <nav>
    <a href="/">今日</a>
    <a href="/archive">過去</a>
    <a href="/settings">設定</a>
    {% if auth_enabled %}
    <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">ログアウト</button></form>
    {% endif %}
  </nav>
  {% endblock %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
